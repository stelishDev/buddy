name: EAS preview build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, ios, android]
        default: all

concurrency:
  group: eas-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # --no-wait queues the build on EAS and returns immediately, so the
      # workflow doesn't burn GitHub minutes while the build runs.
      - name: Trigger EAS build
        run: eas build --profile preview --platform ${{ inputs.platform || 'all' }} --non-interactive --no-wait
