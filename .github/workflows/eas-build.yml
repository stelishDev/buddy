name: EAS Build

# Start from GitHub: Actions → EAS Build → Run workflow (works in the GitHub mobile app too).
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        default: android
        options: [android, ios, all]
      profile:
        description: Build profile (see eas.json)
        type: choice
        default: preview
        options: [preview, development, production]

concurrency:
  group: eas-build-${{ github.ref }}-${{ inputs.platform }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check setup
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret (expo.dev → Account settings → Access tokens)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Check the app is linked to an Expo project
        run: |
          if ! grep -q '"projectId"' app.json; then
            echo "::error::app.json has no extra.eas.projectId. Run 'npx eas-cli@latest init' once locally and commit app.json."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # Queues the build on EAS and exits; the build runs on Expo's servers.
      # Find the build + install link/QR code at expo.dev → Projects → Builds.
      - name: Start EAS build
        run: >
          eas build
          --platform ${{ inputs.platform }}
          --profile ${{ inputs.profile }}
          --non-interactive
          --no-wait
